        with:
          persist-credentials: false

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'

  test:
    needs: [code_paths, test_native_cache]
    if: >-
      always() &&
      needs.code_paths.outputs.test == 'true' &&
      (needs.test_native_cache.result == 'success' || needs.test_native_cache.result == 'skipped')
    uses: ./.github/workflows/unit-tests.yml
    with:
      node_versions: '["24"]'
      # Why: on a PR the first failing shard is usually the answer, and stopping
      # the other seven keeps the self-hosted pool free. When a PR has several
      # independent reds that costs a run per red, so the `ci:no-fail-fast` label
